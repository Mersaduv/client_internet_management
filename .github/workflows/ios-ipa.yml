name: Build iOS IPA (unsigned)

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-ipa:
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.9
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Read app version
        id: version
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d+ -f1)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build iOS without code signing
        run: flutter build ios --release --no-codesign

      - name: Package Runner.app into an IPA
        run: |
          cd build/ios/iphoneos
          mkdir -p Payload
          cp -R Runner.app Payload/
          zip -qry "Ariyabod-v${{ steps.version.outputs.version }}-unsigned.ipa" Payload

      - uses: actions/upload-artifact@v4
        with:
          name: Ariyabod-ios-unsigned-ipa
          path: build/ios/iphoneos/Ariyabod-v${{ steps.version.outputs.version }}-unsigned.ipa
          if-no-files-found: error

      - name: Publish IPA to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build/ios/iphoneos/Ariyabod-v${{ steps.version.outputs.version }}-unsigned.ipa
